# BFT official tracking transfer + DEIM-ported AdamW ScheduleFree optimizer.

SUPER_CONFIG_PATH: ./configs/finetune_tracklet_pseudomot_retrack_optuna_bft_official.yaml

OPTIMIZER_TYPE: AdamWScheduleFree
SCHEDULER_TYPE: none
LR_WARMUP_EPOCHS: 0

# DEIM tomato schedulefree defaults.
SCHEDULEFREE_LR: 0.00025
SCHEDULEFREE_BETAS: [0.9, 0.999]
SCHEDULEFREE_EPS: 1.0e-8
SCHEDULEFREE_WEIGHT_DECAY: 0.000125
SCHEDULEFREE_WARMUP_STEPS: 0
SCHEDULEFREE_R: 0.0
SCHEDULEFREE_WEIGHT_LR_POWER: 2.0
SCHEDULEFREE_FOREACH: True

OUTPUTS_DIR: ./outputs/tracklet_pseudomot_retrack_optuna_bft_official_schedulefree_ft
EXP_NAME: tracklet_pseudomot_retrack_optuna_bft_official_schedulefree_ft
