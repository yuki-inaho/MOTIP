# BFT official tracking transfer + DEIM-ported AutoMuonWithAuxAdam optimizer.

SUPER_CONFIG_PATH: ./configs/finetune_tracklet_pseudomot_retrack_optuna_bft_official.yaml

OPTIMIZER_TYPE: AutoMuonWithAuxAdam
LR_WARMUP_EPOCHS: 0

# DEIM tomato Muon defaults.
MUON_LR: 0.005
MUON_WEIGHT_DECAY: 0.01
MUON_MOMENTUM: 0.95
MUON_NESTEROV: True
MUON_NS_STEPS: 5
MUON_ADAM_LR: 0.00025
MUON_ADAM_BETAS: [0.9, 0.95]
MUON_ADAM_EPS: 1.0e-10
MUON_ADAM_WEIGHT_DECAY: 0.01

OUTPUTS_DIR: ./outputs/tracklet_pseudomot_retrack_optuna_bft_official_muon_ft
EXP_NAME: tracklet_pseudomot_retrack_optuna_bft_official_muon_ft
