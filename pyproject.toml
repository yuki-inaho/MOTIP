[project]
name = "motip-local"
version = "0.1.0"
description = "Local uv environment for MOTIP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=0.33",
  "einops>=0.8",
  "ipykernel>=6.29",
  "ipython>=8.26",
  "matplotlib>=3.8",
  "numpy>=1.26,<2",
  "opencv-python>=4.9,<4.11",
  "optuna>=4.9.0",
  "pandas>=2.2",
  "pillow>=10",
  "pycocotools>=2.0.7",
  "pyyaml>=6.0",
  "scikit-image>=0.22",
  "scipy>=1.12",
  "tensorboard>=2.20.0",
  "torch==2.4.0",
  "torchaudio==2.4.0",
  "torchvision==0.19.0",
  "tqdm>=4.66",
  "wandb>=0.17",
  "you-get>=0.4.1650",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
